<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>زمستان الماسین ۱۴۰۵</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@200;300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#0a1730; --bg2:#12294f;
  --panel:rgba(255,255,255,.055); --line:rgba(200,225,255,.10);
  --text:#eaf3ff; --muted:#8fa8c6; --accent:#9bd6ff;
  --ok:#6fe3bd; --no:#ff9aab; --exc:#ffd584;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root{color-scheme:dark}
:root[data-theme="light"]{
  --bg1:#eef5ff; --bg2:#dceaff;
  --panel:rgba(10,23,48,.055); --line:rgba(10,23,48,.14);
  --text:#14243d; --muted:#5d718b; --accent:#2479b5;
  color-scheme:light;
}
html{height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;color:var(--text);font-family:"Vazirmatn","Tahoma",sans-serif;font-weight:300;
  background:linear-gradient(180deg,var(--bg1),var(--bg2)) fixed;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg1);z-index:10}
#snow{position:fixed;inset:0;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:1040px;margin:0 auto;padding:56px 18px 80px}
header{text-align:center;margin-bottom:40px}
h1{margin:0;font-weight:200;font-size:clamp(34px,7vw,60px);letter-spacing:1px}
.sub{color:var(--muted);margin-top:4px;font-size:15px}
.theme-toggle{
  position:absolute;top:18px;left:18px;width:42px;height:42px;border-radius:50%;
  border:1px solid var(--line);background:var(--panel);color:var(--text);
  font:inherit;font-size:18px;cursor:pointer
}
.tabs{display:flex;justify-content:center;gap:34px;margin:34px 0 0}
.tab{background:none;border:0;color:var(--muted);font:inherit;font-size:16px;padding:6px 2px;cursor:pointer;border-bottom:2px solid transparent;transition:.2s}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);border-color:var(--accent)}
.hidden{display:none!important}
.months{display:flex;justify-content:center;gap:10px;margin:0 0 34px}
.m{background:var(--panel);border:1px solid var(--line);color:var(--muted);font:inherit;padding:8px 26px;border-radius:999px;cursor:pointer;transition:.2s}
.m.on{background:var(--accent);color:#0a1730;border-color:transparent;font-weight:600}
.sheet{overflow-x:auto;padding-bottom:10px;-webkit-overflow-scrolling:touch}
.grid{min-width:max-content}
.row{display:flex;align-items:center;border-radius:16px;padding:2px 0}
.row:nth-child(even){background:var(--panel)}
.lab{position:sticky;right:0;z-index:2;width:250px;flex:none;padding:10px 16px;font-size:14px;line-height:1.6;
  background:linear-gradient(270deg,var(--bg1) 70%,transparent);border-radius:0 16px 16px 0}
.row:nth-child(even) .lab{background:linear-gradient(270deg,#13284b 70%,transparent)}
.head{position:sticky;top:0}
.head .lab{background:none!important;color:var(--muted);font-size:13px}
.d{width:38px;flex:none;text-align:center;font-size:12px;color:var(--muted)}
.d.today{color:var(--accent);font-weight:600}
.cell{width:38px;height:34px;flex:none;display:flex;align-items:center;justify-content:center;border:0;background:none;padding:0;cursor:pointer;font:inherit}
.weekly-controls{height:34px;flex:none;display:flex;align-items:center;justify-content:space-evenly;font-size:38px}
.weekly-controls .cell{width:1em}
.cell i{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;transition:.15s}
.cell:hover i{border-color:var(--accent)}
.cell[data-s="1"] i{background:var(--ok);border-color:var(--ok);color:#06231a}
.cell[data-s="1"] i::after{content:"✓";font-weight:600}
.cell[data-s="2"] i{border-color:var(--no);color:var(--no)}
.cell[data-s="2"] i::after{content:"✕"}
.cell[data-s="3"] i{width:34px;border-radius:999px;background:var(--exc);border-color:var(--exc);color:#2a1d00;font-size:9.5px;font-weight:600}
.cell[data-s="3"] i::after{content:"معذور"}
.hint{text-align:center;color:var(--muted);font-size:13px;margin-top:26px}
.reset{display:block;margin:14px auto 0;background:none;border:0;color:var(--muted);font:inherit;font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:4px;opacity:.7}
/* series */
.stitle{text-align:center;margin-bottom:30px}
.stitle h2{margin:0;font-weight:300;font-size:28px}
.stitle p{margin:4px 0 0;color:var(--muted);font-size:14px}
.eps{display:flex;flex-wrap:wrap;justify-content:center;gap:14px}
.ep{width:150px;box-sizing:border-box;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:16px 16px 14px;position:relative;transition:.2s}
.ep:hover{transform:translateY(-2px);border-color:rgba(155,214,255,.35)}
.ep .n{font-size:34px;font-weight:200;line-height:1.1;margin-bottom:10px}
.ep .l{display:flex;gap:14px;font-size:13px}
.ep a{color:var(--accent);text-decoration:none}
.ep a:hover{text-decoration:underline;text-underline-offset:4px}
.seen{position:absolute;top:14px;left:14px;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:none;cursor:pointer;color:transparent;font-size:12px;padding:0}
.ep.done{opacity:.55}
.ep.done .seen{background:var(--ok);border-color:var(--ok);color:#06231a}
.profile-bar{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:12px;color:var(--muted);font-size:13px}
.profile-bar button{border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;padding:5px 12px;border-radius:999px;cursor:pointer}
#profileGate{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(5,12,25,.78);backdrop-filter:blur(5px)}
#profileGate.hidden{display:none}
.profile-card{width:min(400px,100%);padding:24px;border:1px solid var(--line);border-radius:18px;background:var(--bg1);text-align:center;box-shadow:0 18px 60px rgba(0,0,0,.35)}
.profile-card h2{margin:0 0 8px;font-size:21px;font-weight:400}
.profile-card p{margin:0 0 16px;color:var(--muted);font-size:13px}
.profile-card input{width:100%;margin-top:10px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);font:inherit;text-align:center}
.profile-card button{margin:12px 4px 0;padding:9px 16px;border:0;border-radius:10px;background:var(--accent);color:#0a1730;font:inherit;font-weight:600;cursor:pointer}
.profile-card .secondary{border:1px solid var(--line);background:var(--panel);color:var(--text)}
.auth-error{min-height:20px;margin-top:10px;color:var(--no);font-size:13px}
.auth-choices{display:flex;flex-direction:column;gap:8px}
.auth-choices button{width:100%;margin:4px 0}
.auth-notice{margin:18px 0 0!important;font-size:12px!important}
@media (max-width:600px){
  .lab{width:108px;height:68px;display:flex;align-items:center;justify-content:center;font-size:10px;line-height:1.2;padding:4px;text-align:center;overflow:hidden;overflow-wrap:anywhere;background:var(--bg1)}
  .row{height:70px}
  .row:nth-child(even) .lab{background:var(--bg2)}
  .head{height:70px}
  .head .lab{justify-content:center;background:var(--bg1)!important}
  .d,.cell{width:24px}
  .d{font-size:10px}
  .cell{height:28px}
  .weekly-controls{height:28px;font-size:24px}
  .cell i{width:18px;height:18px;font-size:10px}
  .cell[data-s="3"] i{width:23px;font-size:7px}
  .wrap{padding:36px 10px 60px}
  .eps{gap:10px}
  .ep{width:calc((100% - 10px)/2);height:104px;min-width:0;border-radius:14px;padding:14px 8px 10px}
  .ep .n{height:38px;font-size:28px;line-height:38px;margin:0 0 8px;text-align:center}
  .ep .l{height:32px;justify-content:center;align-items:center;gap:6px;font-size:12px}
  .ep .l a{width:50%;height:32px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:8px}
  .seen{top:8px;left:8px;width:18px;height:18px}
  .tabs{gap:24px}
  .theme-toggle{top:12px;left:12px;width:36px;height:36px}
}
@media (prefers-reduced-motion:reduce){#snow{display:none}}
:root[data-theme="light"] .lab{
  background:linear-gradient(270deg,var(--bg1) 70%,transparent)
}
:root[data-theme="light"] .row:nth-child(even) .lab{
  background:linear-gradient(270deg,#dceaff 70%,transparent)
}
@media (max-width:600px){
  :root[data-theme="light"] .lab{background:var(--bg1)}
  :root[data-theme="light"] .row:nth-child(even) .lab{background:var(--bg2)}
}
</style>
</head>
<body>
<canvas id="snow"></canvas>
<div id="profileGate" role="dialog" aria-modal="true" aria-labelledby="profileTitle">
  <form class="profile-card" id="profileForm">
    <h2 id="profileTitle">خوش آمدید</h2>
    <p id="profileDescription">حساب تازه بسازید یا با حساب قبلی وارد شوید. اطلاعات روی همین دستگاه ذخیره می‌شود.</p>
    <div class="auth-choices" id="authChoices">
      <button id="createAccount" type="button">ساخت حساب جدید</button>
      <button id="loginAccount" type="button">ورود به حساب قبلی</button>
    </div>
      <p class="auth-notice">این نسخه فقط روی همین مرورگر ذخیره می‌کند و امنیت سروری ندارد؛ ورود امن از دستگاه‌های دیگر به سرور نیاز دارد.</p>
    <div id="authFields" class="hidden">
      <input id="profileFirstName" type="text" autocomplete="given-name" maxlength="40" aria-label="نام" placeholder="نام" required>
      <input id="profileLastName" type="text" autocomplete="family-name" maxlength="40" aria-label="تخلص" placeholder="تخلص" required>
      <input id="profileCode" type="password" autocomplete="new-password" minlength="4" maxlength="64" aria-label="کد ورود" placeholder="کد ورود: حداقل ۴ نویسه، شامل حرف و عدد" required>
      <div class="auth-error" id="authError" aria-live="polite"></div>
      <button id="profileSubmit" type="submit">ثبت حساب</button>
      <button id="authBack" class="secondary" type="button">بازگشت</button>
    </div>
  </form>
</div>
<div class="wrap">
  <header>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="تغییر به حالت روشن">☀</button>
    <h1>زمستان الماسین</h1>
    <div class="sub">۱۴۰۵</div>
    <div class="profile-bar"><span id="profileLabel"></span><button id="switchProfile" type="button">تغییر شخص</button></div>
    <div class="tabs">
      <button class="tab on" data-p="sheet">برگه اعمال</button>
      <button class="tab" data-p="series">سریال</button>
    </div>
  </header>

  <section id="sheet">
    <div class="months" id="months"></div>
    <div class="sheet"><div class="grid" id="grid"></div></div>
    <button class="reset" id="reset">پاک کردن این ماه</button>
  </section>

  <section id="series" class="hidden">
    <div class="stitle"><h2>حضرت عمر</h2><p id="prog"></p></div>
    <div class="eps" id="eps"></div>
  </section>
</div>

const store = {
  get(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def}catch(e){console.error("خواندن اطلاعات ذخیره‌شده ناموفق بود.",e);return def}},

const ACTIVE_PROFILE_KEY="za1405:activeProfile";

function normalizedName(name){return name.trim().replace(/\s+/g," ").toLocaleLowerCase()}
function accountName(){return [firstNameInput.value.trim(),lastNameInput.value.trim()].filter(Boolean).join(" ").replace(/\s+/g," ")}
function showAuthError(message){authError.textContent=message}
function setAuthMode(mode){
  authMode=mode;
  authChoices.classList.add("hidden");
  authFields.classList.remove("hidden");
  document.getElementById("profileTitle").textContent=mode==="create"?"ساخت حساب جدید":"ورود به حساب";
  document.getElementById("profileDescription").textContent=mode==="create"?"نام، تخلص و کدی بسازید که حداقل ۴ نویسه و شامل حرف و عدد باشد.":"نام، تخلص و کدی را وارد کنید که هنگام ساخت حساب انتخاب کرده‌اید.";
  document.getElementById("profileSubmit").textContent=mode==="create"?"ثبت حساب":"ورود";
  profileCodeInput.autocomplete=mode==="create"?"new-password":"current-password";
  profileCodeInput.value="";
  showAuthError("");
  firstNameInput.focus();
}
function showAuthChoices(){
  authMode="";
  authFields.classList.add("hidden");
  authChoices.classList.remove("hidden");
  document.getElementById("profileTitle").textContent="خوش آمدید";
  document.getElementById("profileDescription").textContent="حساب تازه بسازید یا با حساب قبلی وارد شوید. اطلاعات روی همین دستگاه ذخیره می‌شود.";
  firstNameInput.value="";
  lastNameInput.value="";
  profileCodeInput.value="";
}
function bytesToHex(bytes){return Array.from(bytes,b=>b.toString(16).padStart(2,"0")).join("")}
function randomHex(size){
  const bytes=new Uint8Array(size);
  crypto.getRandomValues(bytes);
  return bytesToHex(bytes);
}
async function codeVerifier(code,salt){
  const key=await crypto.subtle.importKey("raw",new TextEncoder().encode(code),"PBKDF2",false,["deriveBits"]);
  const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:Uint8Array.from(salt.match(/.{2}/g),b=>parseInt(b,16)),iterations:120000,hash:"SHA-256"},key,256);
  return bytesToHex(new Uint8Array(bits));
}
function sameVerifier(a,b){
  if(typeof a!=="string"||typeof b!=="string"||a.length!==b.length) return false;
  let diff=0;
  for(let i=0;i<a.length;i++) diff|=a.charCodeAt(i)^b.charCodeAt(i);
  return diff===0;
}

function saveProfile(){
  if(!profileKey) return false;
  profiles[profileKey]={...profiles[profileKey],name:profileName,marks,seen};
  if(!store.set(PROFILES_KEY,profiles)){
    window.alert("ذخیرهٔ تغییرات ناموفق بود. حافظهٔ مرورگر را بررسی کنید.");
    return false;
  }
  return true;
}
function activateProfile(id){
  const profile=profiles[id];
  if(!profile) return false;
  profileKey=id;
  profileName=profile.name;
  marks=profile.marks||{};
  seen=Array.isArray(profile.seen)?profile.seen:[];
  if(!saveProfile()||!store.set(ACTIVE_PROFILE_KEY,id)){
    profileKey="";
    profileName="";
    showAuthError("ذخیره‌سازی در مرورگر ناموفق است. فضای ذخیره‌سازی را بررسی کنید.");
    return false;
  }
  document.getElementById("profileLabel").textContent=profileName;
  profileGate.classList.add("hidden");
  renderMonths();renderGrid();renderEps();
  return true;
}
async function createAccount(){
  const name=accountName(), normalized=normalizedName(name), code=profileCodeInput.value;
  if(!firstNameInput.value.trim()||!lastNameInput.value.trim()){
    showAuthError("نام و تخلص را هر دو وارد کنید.");
    return;
  }
  if(!/\p{L}/u.test(code)||!/\p{N}/u.test(code)){
    showAuthError("کد ورود باید شامل حداقل یک حرف و یک عدد باشد.");
    return;
  }
  const matches=Object.entries(profiles).filter(([,p])=>p&&normalizedName(p.name||"")===normalized);
  if(matches.some(([,p])=>p.verifier&&p.salt)){
    showAuthError("این حساب از قبل وجود دارد؛ از گزینهٔ ورود استفاده کنید.");
    return;
  }
  try{
    const salt=randomHex(16), verifier=await codeVerifier(code,salt), id=randomHex(16);
    const legacy=matches.find(([,p])=>!p.verifier||!p.salt);
    let oldMarks=legacy?legacy[1].marks:{}, oldSeen=legacy&&Array.isArray(legacy[1].seen)?legacy[1].seen:[];
    if(!legacy&&Object.keys(profiles).length===0){
      oldMarks=store.get("za1405:marks",{});
      const previousSeen=store.get("za1405:seen",{});
      oldSeen=previousSeen&&Array.isArray(previousSeen.omar)?previousSeen.omar:[];
    }
    const updated={...profiles};
    if(legacy) delete updated[legacy[0]];
    updated[id]={name,salt,verifier,marks:oldMarks||{},seen:oldSeen};
    if(!store.set(PROFILES_KEY,updated)){
      showAuthError("ساخت حساب ناموفق بود؛ فضای ذخیره‌سازی مرورگر را بررسی کنید.");
      return;
    }
    profiles=updated;
    activateProfile(id);
  }catch(error){
    console.error("ساخت حساب ناموفق بود.",error);
    showAuthError("ساخت حساب در این مرورگر ممکن نشد. لطفاً دوباره تلاش کنید.");
  }
}
async function loginAccount(){
  const name=accountName(), normalized=normalizedName(name), code=profileCodeInput.value;
  if(!firstNameInput.value.trim()||!lastNameInput.value.trim()){
    showAuthError("نام و تخلص را هر دو وارد کنید.");
    return;
  }
  try{
    const candidates=Object.entries(profiles).filter(([,p])=>p&&normalizedName(p.name||"")===normalized&&p.salt&&p.verifier);
    for(const [id,profile] of candidates){
      if(sameVerifier(await codeVerifier(code,profile.salt),profile.verifier)){
        activateProfile(id);
        return;
      }
    }
    showAuthError("نام، تخلص یا کد ورود درست نیست.");
  }catch(error){
    console.error("ورود به حساب ناموفق بود.",error);
    showAuthError("ورود در این مرورگر ممکن نشد. لطفاً دوباره تلاش کنید.");
  }
}
profileForm.addEventListener("submit",async e=>{
  e.preventDefault();
  if(authMode==="create") await createAccount();
  if(authMode==="login") await loginAccount();
});
document.getElementById("createAccount").addEventListener("click",()=>setAuthMode("create"));
document.getElementById("loginAccount").addEventListener("click",()=>setAuthMode("login"));
document.getElementById("authBack").addEventListener("click",showAuthChoices);
document.getElementById("switchProfile").addEventListener("click",()=>{
  if(!store.set(ACTIVE_PROFILE_KEY,"")){
    window.alert("خروج از حساب ناموفق بود. لطفاً دوباره تلاش کنید.");
    return;
  }
  profileKey="";
  profileName="";
  profileGate.classList.remove("hidden");
  showAuthChoices();
});

const now=new Date(), t0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
function todayIdx(m){const s=MONTHS[m].start,d=Math.round((t0-new Date(s[0],s[1]-1,s[2]))/864e5);return d>=0&&d<MONTHS[m].days?d:-1}
for(let i=0;i<4;i++) if(todayIdx(i)>=0){cur=i;break}

function rowsOf(m){const k="m"+m;if(!marks[k])marks[k]=ROWS.map(()=>"0".repeat(MONTHS[m].days));return marks[k]}
function statusOfRange(row,start,span){
  const statuses=row.slice(start,start+span);
  return statuses.includes("1")?1:statuses.includes("2")?2:statuses.includes("3")?3:0;
}
function weeklyCell(lab,r,start,span,row){
  const status=statusOfRange(row,start,span);
  return `<button class="cell" data-r="${r}" data-d="${start}" data-span="${span}" data-s="${status}" aria-label="${lab}، بازهٔ روزهای ${fa(start+1)} تا ${fa(start+span)}"><i></i></button>`;
}

function renderMonths(){
  document.getElementById("months").innerHTML=MONTHS.map((m,i)=>`<button class="m ${i===cur?"on":""}" data-m="${i}">${m.name}</button>`).join("");
}
function renderGrid(){
  const m=MONTHS[cur], rows=rowsOf(cur), t=todayIdx(cur);
  let h=`<div class="row head"><div class="lab">${m.name} ۱۴۰۵</div>`;
  for(let d=0;d<m.days;d++) h+=`<div class="d ${d===t?"today":""}">${fa(d+1)}</div>`;
  h+=`</div>`;
  ROWS.forEach((lab,r)=>{
    h+=`<div class="row"><div class="lab">${lab}</div>`;
    if(WEEKLY_ROWS.has(r)){
      h+=`<div class="weekly-controls" style="width:${m.days}em">`;
      for(let start=0;start<m.days;start+=7){
        const span=Math.min(7,m.days-start);
        h+=weeklyCell(lab,r,start,span,rows[r]);
      }
      h+=`</div>`;
    }else{
      for(let d=0;d<m.days;d++) h+=`<button class="cell" data-r="${r}" data-d="${d}" data-span="1" data-s="${rows[r][d]}" aria-label="${lab} ${fa(d+1)}"><i></i></button>`;
    }
    h+=`</div>`;
  });
  document.getElementById("grid").innerHTML=h;
}
document.getElementById("grid").addEventListener("click",e=>{
  const b=e.target.closest(".cell"); if(!b) return;
  const r=+b.dataset.r,d=+b.dataset.d,span=+b.dataset.span||1,rows=rowsOf(cur),max=EXCUSE.has(r+1)?3:2;
  const v=(+b.dataset.s+1)%(max+1);
  rows[r]=rows[r].slice(0,d)+String(v).repeat(span)+rows[r].slice(d+span);
  b.dataset.s=v; saveProfile();
});
document.getElementById("months").addEventListener("click",e=>{
  const b=e.target.closest("[data-m]"); if(!b) return; cur=+b.dataset.m; renderMonths(); renderGrid();
});
document.getElementById("reset").onclick=()=>{
  if(!confirm("همهٔ نشانه‌های ماه "+MONTHS[cur].name+" پاک شود؟")) return;
  delete marks["m"+cur]; saveProfile(); renderGrid();
};

function renderEps(){
  document.getElementById("prog").textContent=`${fa(seen.length)} از ${fa(EPISODES)} قسمت دیده شد`;
  let h="";
  for(let i=0;i<EPISODES;i++){
    h+=`<div class="ep ${seen.includes(i)?"done":""}"><button class="seen" data-i="${i}" aria-label="دیده شد">✓</button>
      <div class="n">${fa(i+1)}</div>
      <div class="l"><a href="${faLink(i)}" target="_blank" rel="noopener">فارسی</a><a href="${enLink(i)}" ${EN_LINKS[i]?"target=\"_blank\" rel=\"noopener\"":""}>English</a></div></div>`;
  }
  document.getElementById("eps").innerHTML=h;
}
document.getElementById("eps").addEventListener("click",e=>{
  const b=e.target.closest(".seen"); if(!b) return; const i=+b.dataset.i;
  seen=seen.includes(i)?seen.filter(x=>x!==i):[...seen,i];
  saveProfile(); renderEps();
});

document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===b));
  document.getElementById("sheet").classList.toggle("hidden",b.dataset.p!=="sheet");
  document.getElementById("series").classList.toggle("hidden",b.dataset.p!=="series");
});

const themeToggle=document.getElementById("themeToggle");
const savedTheme=store.get("za1405:theme","dark");
function applyTheme(theme){
  document.documentElement.dataset.theme=theme;
  themeToggle.textContent=theme==="light"?"☾":"☀";
  themeToggle.setAttribute("aria-label",theme==="light"?"تغییر به حالت تاریک":"تغییر به حالت روشن");
  themeToggle.title=theme==="light"?"حالت تاریک":"حالت روشن";
}
applyTheme(savedTheme==="light"?"light":"dark");
themeToggle.onclick=()=>{
  const theme=document.documentElement.dataset.theme==="light"?"dark":"light";
  applyTheme(theme); store.set("za1405:theme",theme);
};

(function(){
  const cv=document.getElementById("snow"),cx=cv.getContext("2d");let W,H,fl=[];
  function size(){W=cv.width=innerWidth;H=cv.height=innerHeight;
    fl=Array.from({length:Math.min(70,Math.floor(W/16))},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.8+.5,v:Math.random()*.5+.2,p:Math.random()*6}))}
  size();addEventListener("resize",size);
  (function tick(t){cx.clearRect(0,0,W,H);cx.fillStyle="#fff";
    for(const f of fl){f.y+=f.v;f.x+=Math.sin(t/2200+f.p)*.25;if(f.y>H+4){f.y=-4;f.x=Math.random()*W}
      cx.globalAlpha=.35+f.r/6;cx.beginPath();cx.arc(f.x,f.y,f.r,0,6.283);cx.fill()}
    requestAnimationFrame(tick)})(0);
})();

const activeProfile=store.get(ACTIVE_PROFILE_KEY,"");
if(activeProfile&&profiles[activeProfile]&&profiles[activeProfile].salt&&profiles[activeProfile].verifier){
  activateProfile(activeProfile);
}
if(!profileGate.classList.contains("hidden")) showAuthChoices();
</script>
